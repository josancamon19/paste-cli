[project]
name = "paste-cli"
version = "0.2.0"
description = "A lightweight macOS clipboard manager with history, search, and an interactive picker."
readme = "README.md"
authors = [
    { name = "Joan Cabezas", email = "joan.santiago.cabezas@gmail.com" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["clipboard", "paste", "history", "macos", "clipboard-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: MacOS",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "pynput>=1.8.1",
    "pyobjc-framework-cocoa>=12.1",
    "rich>=14.3.3",
    "typer>=0.24.0",
]

[project.scripts]
pst = "pastepy.cli:app"

[project.urls]
Homepage = "https://github.com/josancamon19/paste-cli"
Repository = "https://github.com/josancamon19/paste-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pastepy"]
